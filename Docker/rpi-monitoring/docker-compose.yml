services:
  cadvisor:
    container_name: monitoring-cadvisor
    devices:
      - /dev/kmsg
    # bez ports: - Prometheus zbiera metryki przez siec Dockera (cadvisor:8080), podglad w Grafanie
    hostname: rpi-cadvisor
    image: cleanstart/cadvisor:latest
    networks:
      - rpimonitor_default
    privileged: true
    user: root
    restart: unless-stopped
    security_opt:
      - label=disable
    mem_limit: 128m
    cpus: 0.3
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - ${DOCKER_DATA_ROOT:?}/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/machine-id:/etc/machine-id:ro
    command:
      - '--housekeeping_interval=15s'
      - '--max_housekeeping_interval=30s'
      - '--docker_only=true'
      - '--event_storage_event_limit=default=0'
      - '--event_storage_age_limit=default=0'
      # - '--raw_cgroup_prefix_whitelist=/docker_limit.slice/'
      # - '--disable_root_cgroup_stats=true'
      - '--store_container_labels=false'
      - '--enable_metrics=cpu,cpuLoad,diskIO,memory,network,oom_event,process'
  pihole-exporter:
    image: ekofr/pihole-exporter:latest
    container_name: monitoring-pihole-exporter
    # bez ports: - dostepny tylko dla Prometheusa (pihole-exporter:9617)
    environment:
      PIHOLE_HOSTNAME: ${PIHOLE_HOSTNAME}
      PIHOLE_PORT: 8089
      PIHOLE_PASSWORD: ${PIHOLE_WEBPASSWORD}
      INTERVAL: 30s
      PORT: 9617
    networks:
      - rpimonitor_default
    restart: unless-stopped

  grafana:
    container_name: monitoring-grafana
    environment:
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_PATHS_CONFIG=/etc/grafana/grafana.ini
      - GF_PATHS_DATA=/var/lib/grafana
      - GF_PATHS_HOME=/usr/share/grafana
      - GF_PATHS_LOGS=/var/log/grafana
      - GF_PATHS_PLUGINS=/var/lib/grafana/plugins
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      - GF_UNIFIED_ALERTING_ENABLED=false
      - GF_LOG_LEVEL=warn
      - GF_DASHBOARDS_MIN_REFRESH_INTERVAL=30s
      - GF_PLUGINS_DISABLE_PLUGINS=loki,elasticsearch,tempo,grafana-pyroscope-datasource,opentsdb,stackdriver,zipkin
    hostname: rpi-grafana
    image: grafana/grafana:latest
    user: 1000:1000
    networks:
      - rpimonitor_default
    ports:
      - 3030:3000
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped
    volumes:
      # to be modified depending on your needs
      # - ./grafana/data:/var/lib/grafana
      - ${DATA1T_DIR:?}/grafana_data/data:/var/lib/grafana
      - ${DATA1T_DIR:?}/rpi-monitoring_data/grafana/grafana.ini:/etc/grafana/grafana.ini
      - ${DATA1T_DIR:?}/grafana_data/provisioning:/etc/grafana/provisioning

  node-exporter:
    command:
      - '--collector.processes'
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|run)($$|/)'
#      - '--collector.systemd'
    container_name: monitoring-node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    user: 1000:1000
    # bez ports: - dostepny tylko dla Prometheusa (node-exporter:9100)
    hostname: rpi-exporter
    image: prom/node-exporter:latest
    networks:
      - rpimonitor_default
    mem_limit: 64m
    cpus: 0.2
    restart: unless-stopped

  prometheus:
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.size=150GB'
      # logowanie (basic auth) - plik lezy w katalogu config na dysku
      - '--web.config.file=/etc/prometheus/web-config.yml'
    container_name: monitoring-prometheus
    ports:
      - 9090:9090
    hostname: rpi-prom
    image: prom/prometheus:latest
    user: 1000:1000
    networks:
      - rpimonitor_default
    mem_limit: 400m
    cpus: 0.5
    restart: unless-stopped
    volumes:
      # to be modified depending on your needs
      - ${DATA1T_DIR:?}/prometheus_data:/prometheus
      - ${DATA1T_DIR:?}/rpi-monitoring_data/prometheus/config:/etc/prometheus/
    extra_hosts:
      # dostep do HA (network_mode: host) bez wpisywania IP hosta
      - host.docker.internal:host-gateway

networks:
  rpimonitor_default:
    external: true
