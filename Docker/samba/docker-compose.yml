services:
  samba:
    image: crazymax/samba
    container_name: samba
    network_mode: host
    volumes:
      - "${DATA1T_DIR:?}/samba_data:/data"
      - "${DANE4T_DIR:?}/data4t:/Dane4T"
      - "${FILMY4T_DIR:?}/dlna:/Filmy4T"
      - "${DATA1T_DIR:?}/backup_data:/Data1TBackup"
      - "${DATA1T_DIR:?}/dlna/movies:/Data1TFilmy"
    environment:
      - "TZ=Europe/Warsaw"
      - "SAMBA_LOG_LEVEL=0"
    # 2026-11-08 (20 dni): teraz 166 MiB (procesy 2), szczyt 962 MiB - prawie
    # wylacznie cache kopiowanych plikow, ktory limit po prostu przytnie
    # cpus 2.0 - mniej spowalnia kopiowanie duzych plikow
    mem_limit: 256m
    cpus: 2.0
    restart: unless-stopped
