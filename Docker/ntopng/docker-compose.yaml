version: '3'
services:
  ntopng:
    image: ntop/ntopng_arm64.dev
    hostname: ntop
    container_name: ntop
    restart: unless-stopped
    network_mode: host
    # Port mapping (disable network_mode: host)
    # ports:
    #   - 3030:3030
    volumes:
      - /etc/ntopng.license:/etc/ntopng.license:ro
      - ntopng_redis:/var/lib/redis
    command: [ '-i', 'tcp://*:5556c', '-F', 'clickhouse', '--disable-login' ]
    depends_on:
      - clickhouse

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    hostname: clickhouse
    container_name: clickhouse
    restart: unless-stopped
    network_mode: host
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server

volumes:
  clickhouse_data:
  clickhouse_logs:
  ntopng_redis:
