# More info at https://github.com/pi-hole/docker-pi-hole/ and https://docs.pi-hole.net/
services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8089:80/tcp"
      - "8090:443/tcp"
    environment:
      TZ: 'Europe/Warsaw'
      FTLCONF_webserver_api_password: '${PIHOLE_WEBPASSWORD}'
      # FTLCONF_webserver_port: '8089'
      # FTLCONF_dns_listeningMOde: 'all'
    volumes:
      - '${DATA1T_DIR:?}/pihole_data/etc-pihole:/etc/pihole'
      - '${DATA1T_DIR:?}/pihole_data/etc-dnsmasq.d:/etc/dnsmasq.d'
    # 2026-11-08 (20 dni): teraz 129 MiB (procesy 18), szczyt 523 MiB z cache;
    # zapas na aktualizacje list (gravity) - to DNS calej sieci, OOM niedopuszczalny
    mem_limit: 384m
    cpus: 1.0
    restart: unless-stopped
