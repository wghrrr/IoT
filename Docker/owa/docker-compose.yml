version: "3"
services:
  app:
    image: vladk1m0/docker-owa:latest
    container_name: open-web-analytics
    depends_on:
      - db
    networks:
      - owa_net
    environment:
      - TIME_ZONE="Europe/Warsaw" # Default value UTC
    ports:
      - 8081:80
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
  db:
    image: mysql
    container_name: owa_db
    volumes:
      - ./mysql:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${OWA_MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=owadb
      - MYSQL_USER=owauser
      - MYSQL_PASSWORD=${OWA_MYSQL_PASSWORD}
    networks:
      - owa_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
networks:
  owa_net:
    driver: bridge
