name: immich

# restart: "no" celowo we wszystkich kontenerach - immich jest zasobozerny,
# po restarcie RPi uruchamiany recznie: cd ~/Docker/immich && docker compose up -d

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    cpuset: "0,1"
    mem_limit: 1500m
    mem_reservation: 512m
    volumes:
      # Nie edytowac tej linii - sciezke zmienia sie przez UPLOAD_LOCATION w .env
      - ${UPLOAD_LOCATION:?}:/data
      - ${DANE4T_DIR:?}/data4t/immich_zdjecia:/mnt/photos:ro
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    ports:
      - '2283:2283'
    depends_on:
      redis:
        condition: service_healthy
      database:
        condition: service_healthy
    restart: "no"
    healthcheck:
      disable: false

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9
    cpuset: "0,1"
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    restart: "no"

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    cpuset: "0,1"
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
      # Jesli baza NIE lezy na SSD tylko na wolniejszym nosniku, odkomentowac:
      DB_STORAGE_TYPE: 'HDD'
    volumes:
      # Nie edytowac tej linii - sciezke zmienia sie przez DB_DATA_LOCATION w .env
      - ${DB_DATA_LOCATION:?}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: "no"
    healthcheck:
      disable: false
